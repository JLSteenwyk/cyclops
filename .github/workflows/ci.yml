name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: swift test

      - name: Build universal app
        run: make universal-app

      - name: Verify app bundle
        env:
          CYCLOPS_EXPECTED_ARCHITECTURES: arm64 x86_64
        run: ./scripts/verify-app.sh

      - name: Build and verify DMG
        run: |
          ./scripts/create-dmg.sh
          hdiutil verify "dist/Cyclops-$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist).dmg"

      - name: Smoke-test safe installation
        env:
          CYCLOPS_INSTALL_DESTINATION: ${{ runner.temp }}/Applications/Cyclops.app
          CYCLOPS_LAUNCH_AFTER_INSTALL: "0"
        run: |
          ./scripts/install-app.sh
          ./scripts/verify-app.sh "$CYCLOPS_INSTALL_DESTINATION"
