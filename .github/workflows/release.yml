name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Numeric release version, for example 0.3.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Release version must be numeric, such as 0.3.0" >&2
            exit 1
          fi
          source_version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [[ "$version" != "$source_version" ]]; then
            echo "Release version $version does not match source version $source_version" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must be present on the main branch" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          UPDATE_FEED_REPOSITORY: ${{ vars.UPDATE_FEED_REPOSITORY }}
          UPDATE_FEED_TOKEN: ${{ secrets.UPDATE_FEED_TOKEN }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD SPARKLE_PRIVATE_KEY UPDATE_FEED_REPOSITORY UPDATE_FEED_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "$name is not configured" >&2
              exit 1
            fi
          done
          visibility="$(GH_TOKEN="$UPDATE_FEED_TOKEN" gh repo view "$UPDATE_FEED_REPOSITORY" --json visibility --jq .visibility)"
          if [[ "$visibility" != "PUBLIC" ]]; then
            echo "UPDATE_FEED_REPOSITORY must be public so installed apps can reach it" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password="$(openssl rand -hex 24)"
          keychain_path="$RUNNER_TEMP/cyclops-signing.keychain-db"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cyclops-certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/cyclops-certificate.p12" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "keychain_path=$keychain_path" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials cyclops-ci \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --keychain "$keychain_path"

      - name: Create signed and notarized release
        env:
          CYCLOPS_VERSION: ${{ steps.metadata.outputs.version }}
          CYCLOPS_BUILD_NUMBER: ${{ steps.metadata.outputs.build }}
          CYCLOPS_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          CYCLOPS_EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CYCLOPS_NOTARY_KEYCHAIN_PROFILE: cyclops-ci
          CYCLOPS_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          UPDATE_FEED_REPOSITORY: ${{ vars.UPDATE_FEED_REPOSITORY }}
        run: |
          printf '%s' "$CYCLOPS_SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/cyclops-sparkle-private-key"
          chmod 600 "$RUNNER_TEMP/cyclops-sparkle-private-key"
          export CYCLOPS_SPARKLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/cyclops-sparkle-private-key"
          export CYCLOPS_NOTARY_KEYCHAIN="$keychain_path"
          export CYCLOPS_FEED_URL="https://github.com/$UPDATE_FEED_REPOSITORY/releases/latest/download/appcast.xml"
          export CYCLOPS_DOWNLOAD_BASE_URL="https://github.com/$UPDATE_FEED_REPOSITORY/releases/download/v$CYCLOPS_VERSION"
          ./scripts/release.sh

      - name: Publish public Sparkle update
        env:
          GH_TOKEN: ${{ secrets.UPDATE_FEED_TOKEN }}
          UPDATE_FEED_REPOSITORY: ${{ vars.UPDATE_FEED_REPOSITORY }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/release/Cyclops-$VERSION.dmg" \
            "dist/release/Cyclops-$VERSION.dmg.sha256" \
            "dist/release/Cyclops-$VERSION.md" \
            "dist/release/appcast.xml" \
            --repo "$UPDATE_FEED_REPOSITORY" \
            --title "Cyclops $VERSION" \
            --notes-file "dist/release/Cyclops-$VERSION.md"

      - name: Publish source repository release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/release/Cyclops-$VERSION.dmg" \
            "dist/release/Cyclops-$VERSION.dmg.sha256" \
            "dist/release/appcast.xml" \
            --target "$GITHUB_SHA" \
            --title "Cyclops $VERSION" \
            --notes-file "dist/release/Cyclops-$VERSION.md"

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cyclops-${{ steps.metadata.outputs.version }}-release-evidence
          path: |
            dist/release/appcast.xml
            dist/release/notarization-log.json
            dist/release/notarization.plist
            dist/release/Cyclops-${{ steps.metadata.outputs.version }}.dmg.sha256

      - name: Remove temporary credentials
        if: always()
        run: |
          if [[ -n "${keychain_path:-}" && -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/cyclops-certificate.p12" "$RUNNER_TEMP/cyclops-sparkle-private-key"
